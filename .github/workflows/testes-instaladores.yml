# Testa os instaladores publicados na Release mais nova, em máquinas limpas, e guarda prints da tela.
# Rodar: aba Actions → "Testes dos instaladores" → Run workflow (roda sozinho também a cada Release publicada).
name: Testes dos instaladores
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versão publicada (v1.0.2); vazio usa a mais recente'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

jobs:
  definir-versao:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Selecionar uma única Release para todos os sistemas
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/tests/versao.py
  windows:
    needs: definir-versao
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BASE: ${{ needs.definir-versao.outputs.base }}
      DF_RELEASE_TAG: ${{ needs.definir-versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Baixar e instalar (silencioso)
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:BASE/df-delivery_x64-setup.exe" -OutFile setup.exe
          Start-Process .\setup.exe -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'digital-flying-delivery.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Executável não encontrado após instalar' }
          "Instalado em: $($exe.FullName)"
          "EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*.lnk' | Where-Object Name -like '*Delivery*' | ForEach-Object { "Atalho: $($_.FullName)" }
      - name: Preparar WebDriver do WebView2 instalado
        shell: pwsh
        run: ./.github/tests/driver-windows.ps1
      - name: Configuração inicial e produtos no aplicativo instalado
        shell: pwsh
        run: python .github/tests/interface.py --app "$env:EXE" --driver "$env:DF_WEBDRIVER" --sistema windows --out prints
      - name: Remover política temporária de automação
        if: always()
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          if (Test-Path $policy) { Remove-ItemProperty -Path $policy -Name 'digital-flying-delivery.exe' -ErrorAction SilentlyContinue }
      - name: Desinstalar
        shell: pwsh
        run: |
          $u = Get-ChildItem (Split-Path $env:EXE) -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($u) { Start-Process $u.FullName -ArgumentList '/S' -Wait; Start-Sleep 5; if (Test-Path $env:EXE) { throw 'Desinstalar não removeu o app' } else { 'Desinstalou certinho' } } else { 'Desinstalador não encontrado' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: prints-windows, path: prints/ }

  linux:
    needs: definir-versao
    timeout-minutes: 20
    env:
      BASE: ${{ needs.definir-versao.outputs.base }}
      DF_RELEASE_TAG: ${{ needs.definir-versao.outputs.tag }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: ubuntu, imagem: 'ubuntu:24.04', arquivo: df-delivery_amd64.deb }
          - { nome: mint21, imagem: 'linuxmintd/mint21.3-amd64', arquivo: df-delivery_amd64.deb }
          - { nome: mint22, imagem: 'linuxmintd/mint22-amd64', arquivo: df-delivery_amd64.deb }
          - { nome: ubuntu2204, imagem: 'ubuntu:22.04', arquivo: df-delivery_amd64.deb }
          - { nome: debian, imagem: 'debian:12', arquivo: df-delivery_amd64.deb }
          - { nome: fedora, imagem: 'fedora:41', arquivo: df-delivery.x86_64.rpm }
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Instalar o pacote numa instalação limpa (puxando as dependências)
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            curl -fsSL -o /tmp/pacote "$BASE/${{ matrix.arquivo }}" && mv /tmp/pacote /tmp/${{ matrix.arquivo }}
            apt-get install -y /tmp/${{ matrix.arquivo }} | tail -3
            apt-get install -y -qq xvfb dbus-x11 python3 webkit2gtk-driver >/dev/null
          else
            curl -fsSL -o /tmp/${{ matrix.arquivo }} "$BASE/${{ matrix.arquivo }}"
            dnf install -y /tmp/${{ matrix.arquivo }} | tail -3
            dnf install -y -q xorg-x11-server-Xvfb dbus-x11 python3 webkitgtk6.0 >/dev/null
          fi
          B=$(command -v digital-flying-delivery) || { echo 'Executável não instalado'; exit 1; }
          echo "Instalado em $B"; ls /usr/share/applications | grep -i delivery
          if ldd "$B" | grep 'not found'; then echo 'FALTAM BIBLIOTECAS'; exit 1; else echo 'Todas as bibliotecas encontradas'; fi
      - name: Configuração inicial e produtos no aplicativo instalado
        run: |
          mkdir -p prints
          export DISPLAY=:99 HOME=/root
          Xvfb :99 -screen 0 1366x768x24 > prints/xvfb.log 2>&1 &
          sleep 2
          DRIVER=$(command -v WebKitWebDriver || find /usr -type f -name WebKitWebDriver -print -quit)
          test -n "$DRIVER" || { echo 'WebKitWebDriver não encontrado'; exit 1; }
          dbus-run-session -- python3 .github/tests/interface.py --app "$(command -v digital-flying-delivery)" --driver "$DRIVER" --sistema '${{ matrix.nome }}' --out prints
          find /root/.local/share -name delivery.sqlite | grep -q . || { echo 'Banco não criado'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-${{ matrix.nome }}
          path: prints/
